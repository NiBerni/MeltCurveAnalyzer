[project]
name = "meltcurveanalyzer"
version = "0.1.0"
description = "AI-Driven PCR Melt Curve Analyzer"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.18.5",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "gunicorn>=26.0.0",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "psycopg==3.3.4",
    "psycopg-binary>=3.3.4",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "scipy==1.18.0",
    "sqlalchemy==2.1.0b3",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "pandas-stubs~=3.0.3",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "scipy-stubs~=1.18.0",
]